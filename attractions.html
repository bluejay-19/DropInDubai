<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="images/favicon.ico">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attractions </title>
  <link rel="stylesheet" href="style.css" />
  <script src="js/main.js" defer></script>
  <script src="js/attractions.js" defer></script>
  <script src="js/booking.js" defer></script>
  <script src="js/favourites.js" defer></script>

</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">
      <a href="index.html">
        <img src="images/logo.jpg" alt="Drop In Dubai Logo">
      </a>
    </div>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="hotels.html">Hotels</a>
      <a href="restaurants.html">Restaurants</a>
      <a href="attractions.html" class="active">Attractions</a>
      <a href="events.html">Events</a>
      <a href="profile.html">Profile</a>
    </nav>

    <a href="login.html" class="profile-btn">
        <img src="images/profileicon.png" alt="Profile">
    </a>

    <div class="hamburger">
      <div></div>
      <div></div>
      <div></div>
    </div>

    <div class="mobile-nav">
      <a href="index.html">Home</a>
      <a href="hotels.html">Hotels</a>
      <a href="restaurants.html">Restaurants</a>
      <a href="attractions.html"class="active">Attractions</a>
      <a href="events.html">Events</a>
      <a href="profile.html">Profile</a>
    </div>
  </header>

    <!-- Hero Section -->
    <div class="hero attractionshero">
        <h1>Your Dubai Bucket List Starts Here</h1>
        <p>Unforgettable things to do</p>
    </div>

    <!-- Filter Section -->
    <div class="filter-section">
        <h2>What do you feel like exploring today?</h2>
        <form class="filter-form">
            <label>
                Search
                <input type="text" id="search" placeholder="Attraction name">
            </label>
            <label>
                Type
                <select id="type">
                    <option value="">All</option>
                    <option value="Theme Park">Theme Park</option>
                    <option value="Museum">Museum</option>
                    <option value="Beach">Beach</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Other">Other</option>
                </select>
            </label>
            <label>
                Rating
                <select id="rating">
                    <option value="">All</option>
                    <option value="5★">5★</option>
                    <option value="4★ & Up">4★ & Up</option>
                    <option value="3★ & Up">3★ & Up</option>
                </select>
            </label>
            <label>
                Price (AED)
                <select id="priceRange">
                    <option value="">Any</option>
                    <option value="50">Up to 50</option>
                    <option value="100">Up to 100</option>
                    <option value="200">Up to 200</option>
                    <option value="500">Up to 500</option>
                </select>
            </label>
            <button type="submit" class="filter-btn">Filter</button>
        </form>
    </div>

    <!-- Attractions Cards -->
<section class="attractions-list">
    <h2>Attractions</h2>
    <div class="cards-grid attractions">
        
      <!-- cards will be injected here by attractions.js-->
    </div>
</section>


    <!-- Footer -->
    <footer>
        &copy; 2025 Drop In Dubai | All rights reserved | Social media
    </footer>
    
</body>
</html>
